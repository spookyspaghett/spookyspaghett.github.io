<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heimdal</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="gate">
    <div class="glyph">◇◇◇◇</div>
    <form id="gate-form" autocomplete="off">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">Unlock</button>
      <p class="error" id="error" hidden>Incorrect password.</p>
    </form>

    <section id="revealed" hidden></section>
  </main>

  <script src="assets/js/heimdal-crypto.js"></script>
  <script src="assets/js/heimdal-gate.js"></script>
  <script>
    // FILL IN THE ENCRYPTED PAYLOAD HERE.
    const PASSWORD_HASH = "01b859d064df9391e7e18e8ce825ae4b5c32e1f015bc96cf312f74fa70f4f556";
    const PBKDF2_SALT = "heimdal-arg-fixed-salt-value-2025";
    const PBKDF2_ITERATIONS = 100000;
    const CIPHERTEXT = "aGrtP2m1WVHYKGOeSkHY6/mv7C+8I+D0eFQXIs1UiVgFgPViBcuw30TA614Bh6Fa4G9UgGwekgdWJYbYSvr9btbTYIJh7xi0D/pAjQnbhBBS1WeHjjZ+5gr44F0=";
    const IV = "iTmLmLLCVnsBF2tR";

    HeimdalGate.init({
      passwordHash: PASSWORD_HASH,
      salt: PBKDF2_SALT,
      iterations: PBKDF2_ITERATIONS,
      ciphertext: CIPHERTEXT,
      iv: IV,
    });
  </script>
</body>
</html>
