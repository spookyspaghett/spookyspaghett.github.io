<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heimdal</title>
  <link rel="icon" href="assets/img/heimdal_gent.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="gate">
    <div class="glyph">◇◇◇◇◇◇</div>
    <form id="gate-form" autocomplete="off">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">Unlock</button>
      <p class="error" id="error" hidden>Incorrect password.</p>
    </form>

    <section id="revealed" hidden></section>
  </main>

  <script src="assets/js/heimdal-crypto.js"></script>
  <script src="assets/js/heimdal-gate.js"></script>
  <script>
    // FILL IN THE ENCRYPTED PAYLOAD HERE.
    const PASSWORD_HASH = "3978a8c25b20a671fad937260959803e00d1f04a822de8ee9c59d8ce3355c6b3";
    const PBKDF2_SALT = "heimdal-arg-fixed-salt-value-2025";
    const PBKDF2_ITERATIONS = 100000;
    const CIPHERTEXT = "YkP/GKnJzIpmvUmtzdKGtzDnzKFR6BkezfPDu28JWYoflra9N26qGsPAhPSvKQi8nYuLLfU67Vv+N/oh7S2zYpQSICgyitjBmXgJroyvp7B5UXRVoZmgbyGw7UerBZdfY89ot6fElJBwwoYzZnp97n8uV1raELGwwLs=";
    const IV = "B/xBETDEGjMnmI3V";

    HeimdalGate.init({
      passwordHash: PASSWORD_HASH,
      salt: PBKDF2_SALT,
      iterations: PBKDF2_ITERATIONS,
      ciphertext: CIPHERTEXT,
      iv: IV,
    });
  </script>
</body>
</html>
